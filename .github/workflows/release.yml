name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      id-token: write # OIDC — required for npm provenance
      contents: write # for softprops/action-gh-release to create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(jq -r '.version' package.json)
          echo "Tag version: $TAG_VERSION   package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run check
      # Last gate before an irreversible publish: prove the tarball actually installs and runs.
      - run: bun run smoke
      - run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          VERSION=$(jq -r '.version' package.json)
          bun pm pack
          npm publish "forkable-mcp-${VERSION}.tgz" --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
