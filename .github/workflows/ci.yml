name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: mkdir artifacts
      - run: bun pm pack --destination artifacts
      - run: bun build scripts/smoke.ts --target=node --format=esm --outfile=artifacts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts

  smoke:
    name: smoke (${{ matrix.runtime }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Bun
            runner: bunx
            command: bun
          - runtime: Node
            runner: npx
            command: node
    steps:
      - uses: oven-sh/setup-bun@v2
        if: matrix.runner == 'bunx'
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        if: matrix.runner == 'npx'
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts
      - run: ${{ matrix.command }} artifacts/smoke.mjs ${{ matrix.runner }} artifacts
